name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    uses: ./.github/workflows/api.yml

  web-build:
    name: Web / Build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build web check container
        run: docker compose --file infra/compose.checks.yaml build web
      - name: Build web application
        run: docker compose --file infra/compose.checks.yaml run --rm --no-deps web npm run build

  web-test:
    name: Web / Tests
    needs: web-build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build web test container
        run: docker compose --file infra/compose.checks.yaml build web
      - name: Run web unit tests
        run: docker compose --file infra/compose.checks.yaml run --rm --no-deps web npm test

  web-format:
    name: Web / Format
    needs: web-build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build web tooling container
        run: docker compose --file infra/compose.checks.yaml build web
      - name: Check web formatting
        run: docker compose --file infra/compose.checks.yaml run --rm --no-deps web npm run format:check

  browser:
    uses: ./.github/workflows/browser.yml
