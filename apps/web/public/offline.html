<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>Horizon — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font: 16px/1.5 system-ui, sans-serif;
        color: #202b29;
        background: #f7f8f5;
      }
      main { width: min(100%, 380px); }
      h1 { margin: 0; font-size: 24px; }
      p { color: #53635e; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        border-radius: 999px;
        padding: 0 18px;
        color: #fff;
        background: #2f6b5a;
        font-weight: 600;
      }
      a:focus-visible { outline: 2px solid #2f6b5a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Connect to the internet to see your plans in Horizon.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
