name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release-tag:
    name: Release / Tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*) ;;
            *) echo "Expected a date-based tag such as v2026.11.14.42" >&2; exit 1 ;;
          esac
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  api:
    needs: release-tag
    uses: ./.github/workflows/api.yml
    with:
      check-migrations: true

  web-build:
    name: Web / Build
    needs: release-tag
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Build web check container
        run: docker compose --file infra/compose.checks.yaml build web
      - name: Build web application
        run: docker compose --file infra/compose.checks.yaml run --rm --no-deps web npm run build

  web-test:
    name: Web / Tests
    needs: web-build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Build web test container
        run: docker compose --file infra/compose.checks.yaml build web
      - name: Run web unit tests
        run: docker compose --file infra/compose.checks.yaml run --rm --no-deps web npm test

  web-format:
    name: Web / Format
    needs: web-build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Build web tooling container
        run: docker compose --file infra/compose.checks.yaml build web
      - name: Check web formatting
        run: docker compose --file infra/compose.checks.yaml run --rm --no-deps web npm run format:check

  browser:
    needs: release-tag
    uses: ./.github/workflows/browser.yml

  production-compose:
    name: Release / Production Compose
    needs: release-tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate production Compose configuration
        env:
          IMAGE_TAG: release-check
          POSTGRES_DB: horizon_check
          POSTGRES_USER: horizon_check
          POSTGRES_PASSWORD: ci-only-password
          AUTH_JWT_SECRET: ci-only-secret
          AUTH_JWT_ISSUER: https://horizon.false.tel
          AUTH_PUBLIC_URL: https://horizon.false.tel/auth/complete
          SMTP_HOST: localhost
          SMTP_FROM: Horizon <no-reply@example.invalid>
        run: docker compose --file infra/compose.prod.yaml config --quiet

  publish:
    name: Publish / GHCR images
    needs:
      - release-tag
      - api
      - web-build
      - web-test
      - web-format
      - browser
      - production-compose
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image to GHCR (ARM64)
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./infra/docker/api/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ghcr.io/kovalmax/horizon/api:${{ github.event.release.tag_name }}
          sbom: true
          provenance: true
          cache-from: type=registry,ref=ghcr.io/kovalmax/horizon/api:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/kovalmax/horizon/api:buildcache-arm64,mode=max,ignore-error=true
      - name: Build and publish web image to GHCR (ARM64)
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./infra/docker/web/Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: ghcr.io/kovalmax/horizon/web:${{ github.event.release.tag_name }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=horizon-web
          cache-to: type=gha,mode=max,scope=horizon-web

  deploy:
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Prepare SSH credentials and release tag
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          printf 'IMAGE_TAG=%s\n' "$RELEASE_TAG" > .image-tag
      - name: Stage production Compose configuration
        run: |
          scp -i "$HOME/.ssh/id_ed25519" \
            infra/compose.prod.yaml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Install Horizon routes for shared Traefik
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu
             install -d -m 755 "$HOME/traefik/dynamic"
             chmod 755 "$HOME/traefik/dynamic"
             cat > "$HOME/traefik/dynamic/horizon.yml.next"
             chmod 644 "$HOME/traefik/dynamic/horizon.yml.next"
             mv "$HOME/traefik/dynamic/horizon.yml.next" "$HOME/traefik/dynamic/horizon.yml"' \
            < infra/traefik/dynamic.yml
      - name: Stage release image tag on deployment host
        run: |
          scp -i "$HOME/.ssh/id_ed25519" .image-tag \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.image-tag.next"
      - name: Activate release tag and preserve previous tag
        run: |
          echo 'DEPLOY_STARTED=true' >> "$GITHUB_ENV"
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && set -eu && test -s .image-tag.next && \
             if [ -f .image-tag ]; then cp .image-tag .image-tag.previous; \
             else rm -f .image-tag.previous; fi && \
             mv .image-tag.next .image-tag"
      - name: Validate production Compose configuration
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose --env-file .env.production \
             --env-file .image-tag --project-name horizon \
             --file compose.prod.yaml config --quiet"
      - name: Pull release images
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose --env-file .env.production \
             --env-file .image-tag --project-name horizon \
             --file compose.prod.yaml pull api web"
      - name: Apply database migrations before rollout
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose --env-file .env.production \
             --env-file .image-tag --project-name horizon \
             --file compose.prod.yaml run --rm api migrate"
      - name: Roll out API and web services
        run: |
          echo 'ROLLOUT_STARTED=true' >> "$GITHUB_ENV"
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose --env-file .env.production \
             --env-file .image-tag --project-name horizon \
             --file compose.prod.yaml up --detach --no-build --remove-orphans"
          echo 'ROLLOUT_SUCCEEDED=true' >> "$GITHUB_ENV"
      - name: Check production readiness
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
             --retry 12 --retry-connrefused --retry-delay 5 \
             https://horizon.false.tel/api/health/ready"
      - name: Remove previous release tag after successful readiness
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && rm -f .image-tag.previous"
      - name: Roll back release after deployment failure
        if: ${{ failure() && env.DEPLOY_STARTED == 'true' }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             ROLLOUT_STARTED='${ROLLOUT_STARTED:-false}' \
             ROLLOUT_SUCCEEDED='${ROLLOUT_SUCCEEDED:-false}' sh -s" <<'REMOTE'
          set -eu
          if [ -f .image-tag.previous ]; then
            mv .image-tag.previous .image-tag
            if [ "$ROLLOUT_STARTED" = 'true' ]; then
              docker compose --env-file .env.production --env-file .image-tag \
                --project-name horizon --file compose.prod.yaml pull api web
              docker compose --env-file .env.production --env-file .image-tag \
                --project-name horizon --file compose.prod.yaml up --detach \
                --no-build --remove-orphans
              curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
                --retry 12 --retry-connrefused --retry-delay 5 \
                https://horizon.false.tel/api/health/ready
            fi
          elif [ "$ROLLOUT_SUCCEEDED" = 'true' ]; then
            echo 'No previous release exists; retaining the first rollout tag.' >&2
          else
            rm -f .image-tag
            echo 'No previous release exists; no application rollout was completed.' >&2
          fi
          REMOTE
