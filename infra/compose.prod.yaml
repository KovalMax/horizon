# Production application stack; image versions come from the synced .image-tag.
services:
  db:
    image: postgres:17.12-trixie@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - database

  api:
    image: ghcr.io/kovalmax/horizon/api:${IMAGE_TAG:?Set IMAGE_TAG using .image-tag}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
      POSTGRES_USER: horizon_runtime
      POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Provision the Horizon runtime role before deployment}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in the deployment environment}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:?Set AUTH_JWT_ISSUER in the deployment environment}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-horizon-api}
      AUTH_JWT_KID: ${AUTH_JWT_KID:-v1}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:?Set AUTH_PUBLIC_URL in the deployment environment}
      AUTH_TRUSTED_PROXY_IP: ${AUTH_TRUSTED_PROXY_IP:-172.30.0.250}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in the deployment environment}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in the deployment environment}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      database: {}
      edge:
        aliases: [horizon-api]
      egress: {}

  migrate:
    image: ghcr.io/kovalmax/horizon/api:${IMAGE_TAG:?Set IMAGE_TAG using .image-tag}
    profiles: [ops]
    command: [migrate]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    depends_on:
      db:
        condition: service_healthy
    networks: [database]

  web:
    image: ghcr.io/kovalmax/horizon/web:${IMAGE_TAG:?Set IMAGE_TAG using .image-tag}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      edge:
        aliases: [horizon-web]

volumes:
  postgres_prod_data:

networks:
  database:
    internal: true
  edge:
    external: true
    name: public-edge
  egress:
