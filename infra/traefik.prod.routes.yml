http:
  routers:
    same-origin-api:
      rule: Host(`horizon.false.tel`) && (Path(`/api`) || PathPrefix(`/api/`))
      entryPoints: [websecure]
      service: api
      middlewares: [security-headers, strip-api]
      tls:
        certResolver: letsencrypt
    web:
      rule: Host(`horizon.false.tel`)
      entryPoints: [websecure]
      service: web
      middlewares: [security-headers]
      tls:
        certResolver: letsencrypt
    api:
      rule: Host(`api.horizon.false.tel`)
      entryPoints: [websecure]
      service: api
      middlewares: [security-headers, api-cors]
      tls:
        certResolver: letsencrypt
  services:
    web:
      loadBalancer:
        servers:
          - url: http://web:8080
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
  middlewares:
    security-headers:
      headers:
        contentSecurityPolicy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; upgrade-insecure-requests"
        contentTypeNosniff: true
        customFrameOptionsValue: DENY
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), geolocation=(), microphone=(), payment=()"
        stsSeconds: 31536000
    strip-api:
      stripPrefix:
        prefixes: [/api]
    api-cors:
      headers:
        accessControlAllowOriginList:
          - https://horizon.false.tel
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
        accessControlAllowCredentials: false
        accessControlMaxAge: 600
        addVaryHeader: true
