name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: horizon-checks-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - name: Build API check container
        run: docker compose --file compose.checks.yaml build api
      - name: Build API
        run: docker compose --file compose.checks.yaml run --rm --no-deps api cargo build --locked --all-targets
      - name: Start PostgreSQL for API integration tests
        run: docker compose --file compose.checks.yaml up --detach --wait db
      - name: Run API tests
        run: docker compose --file compose.checks.yaml run --rm --no-deps api cargo test --locked
      - name: Check API formatting
        run: docker compose --file compose.checks.yaml run --rm --no-deps api cargo fmt --all -- --check
      - name: Run API Clippy
        run: docker compose --file compose.checks.yaml run --rm --no-deps api cargo clippy --locked --all-targets -- -D warnings
      - name: Build web check container
        run: docker compose --file compose.checks.yaml build web
      - name: Build web application
        run: docker compose --file compose.checks.yaml run --rm --no-deps web npm run build
      - name: Run web unit tests
        run: docker compose --file compose.checks.yaml run --rm --no-deps web npm test
      - name: Check web formatting
        run: docker compose --file compose.checks.yaml run --rm --no-deps web npm run format:check
      - name: Stop PostgreSQL and remove check containers
        if: always()
        run: docker compose --file compose.checks.yaml down --remove-orphans

  browser:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run browser checks
        run: npm run test:e2e
        working-directory: apps/web
