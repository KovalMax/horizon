name: Performance baseline (report only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Docker API and PostgreSQL baseline
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Measure the seeded stack
        run: HORIZON_PERF_RESULTS="$RUNNER_TEMP/horizon/performance" make perf-baseline
      - name: Add observations to the run summary
        run: cat "$RUNNER_TEMP"/horizon/performance/run.*/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload baseline and query plans
        uses: actions/upload-artifact@v7
        with:
          name: horizon-performance-baseline
          path: |
            ${{ runner.temp }}/horizon/performance/run.*/summary.md
            ${{ runner.temp }}/horizon/performance/run.*/baseline.json
            ${{ runner.temp }}/horizon/performance/run.*/postgres.json
            ${{ runner.temp }}/horizon/performance/run.*/query-plans.txt
            ${{ runner.temp }}/horizon/performance/run.*/fixtures.txt
            ${{ runner.temp }}/horizon/performance/run.*/calendar-profile.log
          if-no-files-found: error
