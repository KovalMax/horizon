http:
  routers:
    web:
      rule: Host(`horizon.localhost`)
      entryPoints: [websecure]
      service: web
      middlewares: [dev-security-headers]
      tls: {}
    api:
      rule: (Host(`horizon.localhost`) && (Path(`/api`) || PathPrefix(`/api/`))) || Host(`api.horizon.localhost`)
      entryPoints: [websecure]
      priority: 100
      service: api
      middlewares: [dev-security-headers, dev-api-cors, dev-api-rate-limit, strip-api]
      tls: {}
  services:
    web:
      loadBalancer:
        servers:
          - url: http://web:3000
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
  middlewares:
    dev-api-rate-limit:
      rateLimit:
        average: 120
        period: 1m
        burst: 30
    dev-api-cors:
      headers:
        accessControlAllowOriginList:
          - https://horizon.localhost
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
        accessControlExposeHeaders:
          - Retry-After
        accessControlAllowCredentials: false
        accessControlMaxAge: 600
        addVaryHeader: true
    dev-security-headers:
      headers:
        contentTypeNosniff: true
        customFrameOptionsValue: DENY
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), geolocation=(), microphone=(), payment=()"
    strip-api:
      stripPrefix:
        prefixes: [/api]
tls:
  certificates:
    - certFile: /certs/horizon.pem
      keyFile: /certs/horizon-key.pem
