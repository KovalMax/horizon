# Horizon production routes for the shared Traefik file provider.
http:
  routers:
    horizon-web:
      rule: Host(`horizon.false.tel`)
      entryPoints: [websecure]
      service: horizon-web
      middlewares: [horizon-security-headers]
      tls:
        certResolver: letsencrypt
    horizon-api:
      rule: (Host(`horizon.false.tel`) && (Path(`/api`) || PathPrefix(`/api/`))) || Host(`api.horizon.false.tel`)
      entryPoints: [websecure]
      priority: 100
      service: horizon-api
      middlewares: [horizon-security-headers, horizon-api-cors, horizon-api-rate-limit, horizon-strip-api]
      tls:
        certResolver: letsencrypt
  services:
    horizon-web:
      loadBalancer:
        servers:
          - url: http://horizon-web:8080
    horizon-api:
      loadBalancer:
        servers:
          - url: http://horizon-api:8000
  middlewares:
    # One IP-based bucket shared by both public API routes.
    horizon-api-rate-limit:
      rateLimit:
        average: 120
        period: 1m
        burst: 30
    horizon-security-headers:
      headers:
        contentSecurityPolicy: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; upgrade-insecure-requests"
        contentTypeNosniff: true
        customFrameOptionsValue: DENY
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), geolocation=(), microphone=(), payment=()"
        stsSeconds: 31536000
    horizon-strip-api:
      stripPrefix:
        prefixes: [/api]
    horizon-api-cors:
      headers:
        accessControlAllowOriginList:
          - https://horizon.false.tel
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
        accessControlExposeHeaders:
          - Retry-After
        accessControlAllowCredentials: false
        accessControlMaxAge: 600
        addVaryHeader: true
