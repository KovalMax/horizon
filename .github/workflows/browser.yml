name: Browser gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deterministic:
    name: Playwright / Deterministic
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run browser checks
        run: HORIZON_BROWSER_RESULTS="$RUNNER_TEMP/horizon/browser" make test-browser
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-browser-failures
          path: ${{ runner.temp }}/horizon/browser/deterministic/**/trace.zip
          if-no-files-found: ignore

  signed-in:
    name: Playwright / Signed-in stack
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      HORIZON_CHECK_API_IMAGE: horizon-ci-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Prepare cached API image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./infra/docker/api/Dockerfile
          load: true
          tags: ${{ env.HORIZON_CHECK_API_IMAGE }}
          cache-from: type=gha,scope=horizon-api-checks-amd64
      - name: Run signed-in browser checks
        run: HORIZON_BROWSER_RESULTS="$RUNNER_TEMP/horizon/browser" make test-e2e-stack
